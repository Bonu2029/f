<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1200" viewBox="0 0 960 1200" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="booking-ambient-pool0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E7D2B5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E7D2B5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="booking-ambient-pool1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BE8577" stop-opacity="0.8099999999999999"/>
      <stop offset="100%" stop-color="#BE8577" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="booking-ambient-pool2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5947F" stop-opacity="0.6699999999999999"/>
      <stop offset="100%" stop-color="#A5947F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="booking-ambient-veil" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FFFCF7" stop-opacity="0.34"/>
      <stop offset="48%" stop-color="#FAF8F5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A5947F" stop-opacity="0.34"/>
    </linearGradient>
    <radialGradient id="booking-ambient-vignette" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#A5947F" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A5947F" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="booking-ambient-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="booking-ambient-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>

  <rect width="960" height="1200" fill="#EDE5DA"/>
  <circle cx="474.3" cy="652.3" r="490.2" fill="url(#booking-ambient-pool0)"/>
  <circle cx="470.7" cy="169.9" r="681.2" fill="url(#booking-ambient-pool1)"/>
  <circle cx="316.1" cy="694.5" r="521.5" fill="url(#booking-ambient-pool2)"/>

  <ellipse cx="491.6" cy="718.7" rx="259.3" ry="316.3"
           fill="#FFFCF7" opacity="0.5" filter="url(#booking-ambient-soft)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M -76.8 666.4 C 288 246.6, 652.8 1595.1, 1036.8 1175.3" stroke="#A9663A" stroke-width="3" opacity="0.3"/>
