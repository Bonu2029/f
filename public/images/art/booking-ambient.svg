    <path d="M -76.8 603.6 C 288 334.2, 652.8 1209.5, 1036.8 940.1" stroke="#BE8577" stroke-width="2.4" opacity="0.4"/>
    <path d="M -76.8 544.2 C 288 409.2, 652.8 1219.7, 1036.8 1084.7" stroke="#A5947F" stroke-width="2.1" opacity="0.4"/>
    <path d="M -76.8 161.1 C 288 -253.4, 652.8 1187.3, 1036.8 772.8" stroke="#A9663A" stroke-width="1.4" opacity="0.3"/>
