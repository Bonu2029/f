<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1200" viewBox="0 0 960 1200" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="service-nails-pool0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DCB0A4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#DCB0A4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="service-nails-pool1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D6B88F" stop-opacity="0.8099999999999999"/>
      <stop offset="100%" stop-color="#D6B88F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="service-nails-pool2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9A8FB4" stop-opacity="0.6699999999999999"/>
      <stop offset="100%" stop-color="#9A8FB4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="service-nails-veil" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FFFCF7" stop-opacity="0.34"/>
      <stop offset="48%" stop-color="#FAF8F5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A5947F" stop-opacity="0.34"/>
    </linearGradient>
    <radialGradient id="service-nails-vignette" cx="50%" cy="46%" r="72%">
