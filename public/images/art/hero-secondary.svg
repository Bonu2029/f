<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="hero-secondary-pool0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C1B9D2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C1B9D2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-secondary-pool1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BE8577" stop-opacity="0.8099999999999999"/>
      <stop offset="100%" stop-color="#BE8577" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-secondary-pool2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D6B88F" stop-opacity="0.6699999999999999"/>
      <stop offset="100%" stop-color="#D6B88F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-secondary-veil" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FFFCF7" stop-opacity="0.34"/>
      <stop offset="48%" stop-color="#FAF8F5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A5947F" stop-opacity="0.34"/>
    </linearGradient>
    <radialGradient id="hero-secondary-vignette" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#A5947F" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A5947F" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="hero-secondary-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="hero-secondary-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="#EDE5DA"/>
  <circle cx="466.9" cy="696.8" r="655.5" fill="url(#hero-secondary-pool0)"/>
  <circle cx="448.6" cy="406.5" r="655.1" fill="url(#hero-secondary-pool1)"/>
  <circle cx="215.1" cy="882.5" r="548.1" fill="url(#hero-secondary-pool2)"/>

  <ellipse cx="358.8" cy="718.9" rx="302.2" ry="368.7"
           fill="#FFFCF7" opacity="0.5" filter="url(#hero-secondary-soft)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M -72 7.3 C 270 -133.2, 612 496.5, 972 356" stroke="#A9663A" stroke-width="3" opacity="0.5"/>
    <path d="M -72 248.2 C 270 45.5, 612 1162.7, 972 960" stroke="#BE8577" stroke-width="2.1" opacity="0.5"/>
    <path d="M -72 216.4 C 270 72.8, 612 987.5, 972 843.9" stroke="#D6B88F" stroke-width="1.2" opacity="0.2"/>
    <path d="M -72 1302.4 C 270 935.1, 612 1292.1, 972 924.8" stroke="#A9663A" stroke-width="3.2" opacity="0.3"/>
    <path d="M -72 1071.3 C 270 623.9, 612 888.9, 972 441.5" stroke="#BE8577" stroke-width="3.2" opacity="0.4"/>
    <path d="M -72 13.2 C 270 -465.2, 612 239.4, 972 -239" stroke="#D6B88F" stroke-width="3" opacity="0.5"/>
    <path d="M -72 856.7 C 270 711.9, 612 403.8, 972 259" stroke="#A9663A" stroke-width="2.6" opacity="0.3"/>
  </g>

  <rect width="900" height="1200" fill="url(#hero-secondary-veil)"/>
  <rect width="900" height="1200" fill="url(#hero-secondary-vignette)"/>
  <rect width="900" height="1200" filter="url(#hero-secondary-grain)" opacity="0.16" style="mix-blend-mode:multiply"/>
