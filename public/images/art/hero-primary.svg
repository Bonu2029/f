    </radialGradient>
    <filter id="hero-primary-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="hero-primary-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="#EDE5DA"/>
  <circle cx="230.6" cy="581.8" r="766.1" fill="url(#hero-primary-pool0)"/>
