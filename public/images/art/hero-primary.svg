<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="hero-primary-pool0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A2B597" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#A2B597" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-primary-pool1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D6B88F" stop-opacity="0.8099999999999999"/>
      <stop offset="100%" stop-color="#D6B88F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-primary-pool2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7E9473" stop-opacity="0.6699999999999999"/>
      <stop offset="100%" stop-color="#7E9473" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-primary-veil" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FFFCF7" stop-opacity="0.34"/>
      <stop offset="48%" stop-color="#FAF8F5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A5947F" stop-opacity="0.34"/>
    </linearGradient>
    <radialGradient id="hero-primary-vignette" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#A5947F" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A5947F" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="hero-primary-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="hero-primary-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="800" height="1200" fill="#EDE5DA"/>
  <circle cx="205" cy="581.8" r="766.1" fill="url(#hero-primary-pool0)"/>
  <circle cx="489.7" cy="618.4" r="716.7" fill="url(#hero-primary-pool1)"/>
  <circle cx="564.8" cy="973.3" r="492.3" fill="url(#hero-primary-pool2)"/>

  <ellipse cx="300.5" cy="625.8" rx="255" ry="311.1"
