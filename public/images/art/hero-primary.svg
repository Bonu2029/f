    <path d="M -64 993.5 C 240 829.1, 544 939.2, 864 774.8" stroke="#7E9473" stroke-width="3.3" opacity="0.3"/>
    <path d="M -64 1300.4 C 240 1048.1, 544 890.8, 864 638.5" stroke="#A9663A" stroke-width="1" opacity="0.5"/>
    <path d="M -64 789.2 C 240 600, 544 1366.9, 864 1177.7" stroke="#D6B88F" stroke-width="1.1" opacity="0.3"/>
    <path d="M -64 -36.3 C 240 -239.1, 544 839.7, 864 636.9" stroke="#7E9473" stroke-width="2.8" opacity="0.3"/>
    <path d="M -64 7.9 C 240 -455.7, 544 -114.4, 864 -578" stroke="#A9663A" stroke-width="3.2" opacity="0.5"/>
