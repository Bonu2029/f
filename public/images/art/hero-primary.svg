  <rect width="800" height="1200" fill="url(#hero-primary-veil)"/>
  <rect width="800" height="1200" fill="url(#hero-primary-vignette)"/>
  <rect width="800" height="1200" filter="url(#hero-primary-grain)" opacity="0.16" style="mix-blend-mode:multiply"/>
