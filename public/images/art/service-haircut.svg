    </radialGradient>
    <radialGradient id="service-haircut-pool1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7E9473" stop-opacity="0.8099999999999999"/>
      <stop offset="100%" stop-color="#7E9473" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="service-haircut-pool2" cx="50%" cy="50%" r="50%">
