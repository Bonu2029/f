# Netlify — full Next.js deployment (Git-connected or `netlify deploy`).
#
# This keeps everything the site can do: the /api/booking endpoint, and Google
# reviews re-fetched hourly on the server rather than frozen at build time.
#
# If you would rather drag a folder onto Netlify instead, run
# `npm run build:static` and drop the resulting `out/` folder — see README.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Fingerprinted build output is safe to cache forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
